name    = PAX
author  = PAX Contributors
license = Artistic_2_0
copyright_holder = PAX Contributors
copyright_year = 2026
version = 0.026

[GatherDir]
exclude_filename = .pax
exclude_filename = dist.ini
exclude_filename = PAX-*.tar.gz
exclude_filename = PAX-*.tgz
exclude_filename = AGENTS.override.md
exclude_filename = BACKLOG.md
exclude_filename = Dockerfile
exclude_filename = DOCKER.md
exclude_filename = docker-compose.yml
prune_directory = DD Source Code
prune_directory = projects
prune_directory = project
prune_directory = cover_db
prune_directory = support
prune_directory = pax-webapp
prune_directory = blogs
prune_directory = examples
prune_directory = tools
prune_directory = docs
prune_directory = t/tmp-dash-scan
prune_directory = t/tmp-pcu-check
prune_directory = t/tmp-pcu-check2
prune_directory = t/tmp-repro
prune_directory = t/tmp-standalone-manual
prune_directory = t/tmp-sow03
prune_directory = t/tmp
exclude_match = ^(?:\./)?(?:SOW[^/]*(?:$|/)|DD Source Code/|projects?/|project/|cover_db/|support/|pax-webapp/|blogs/|examples/|tools/|docs/|BACKLOG\.md$|Dockerfile$|DOCKER\.md$|docker-compose\.yml$|pax-runtime-probe-[^/]+\.pl$|(?:.*\/)?\.pax/|.*\.tar\.gz$|AGENTS\.override\.md$|t/tmp)
[PruneCruft]
[ManifestSkip]
[MetaYAML]
[MetaJSON]
[License]
[ExecDir]
[MakeMaker]
[Manifest]
[Prereqs::FromCPANfile]
